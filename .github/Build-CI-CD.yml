
name: Run Github Actions CI/CD

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
    tags:
      - 'v*'
  pull_request:
    branches:
      - main  # Optional: Trigger on pull requests to main branch s
    tags:
      - 'v*'

jobs:
  run-unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        run: node --version
        run: npm --version

  # Sonarqube action scan code analysis
  SonarQube-Scan:
    runs-on: ubuntu-latest
    needs: [run-unittest]
    steps:
        # 
        # Checkout the repository content
        # 
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
            # Disabling shallow clone 
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_HUB_PEROSNAL_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        with:
          args: >
            -Dsonar.organization=phonkritpgm
            -Dsonar.projectKey=phonkritpgm_test-ci-cd
            
      # -Dsonar.python.coverage.reportPaths=coverage.xml
  # Sonarqube

  # #################
  # Docker image
  build_docker_build_image_push_registry:
    runs-on: ubuntu-latest
    needs: [SonarQube-Scan]
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub or another registry
      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          # username: ${{ secrets.DOCKER_USERNAME }}
          # password: ${{ secrets.DOCKER_PASSWORD }}
          # registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}

      # Step 3: Build the Docker image with a tag based on commit SHA
      - name: Build Docker Image
        run: |
          echo "--DOCKER_HUB_USERNAME" + ${{ secrets.DOCKER_HUB_USERNAME }}
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ env.VERSION }} .

      # Step 4: Tag the image as "latest" for easy reference
      - name: Tag Docker Image as latest
        run: |
          echo "--DOCKER_HUB_USERNAME" + ${{ secrets.DOCKER_HUB_USERNAME }}
          docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ env.VERSION }} ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:latest

      # Step 5: Push the Docker image to the registry
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:latest

  # Step 5: Deploy to server via SSH
  deployment-server:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [build_docker_build_image_push_registry]
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22  # Use your server’s SSH port (default is 22)
          script: |
            # Pull the latest Docker image
            docker pull ${{ secrets.DOCKER_USERNAME }}/testdocker:latest
            
            # Stop and remove the existing container
            docker rm -f testdocker || true
            
            # Run a new container with the latest image
            docker run -d --name testdocker -p 80:80 ${{ secrets.DOCKER_USERNAME }}/testdocker:latest