
name: Run Github Actions CI/CD

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
    tags: 
      - v*.*.*

  pull_request:
    branches:
      - main  # Optional: Trigger on pull requests to main branch s
    tags:
      - v*
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-image-fontend:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub or another registry
      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          # username: ${{ secrets.DOCKER_USERNAME }}
          # password: ${{ secrets.DOCKER_PASSWORD }}
          # registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}

      # Step 3: Build the Docker image with a tag based on commit SHA
      - name: Build Docker Image
        run: |
          echo "--DOCKER_HUB_USERNAME" + ${{ secrets.DOCKER_HUB_USERNAME }}
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ steps.meta.outputs.tags }} .

      # Step 4: Tag the image as "latest" for easy reference
      - name: Tag Docker Image as latest
        run: |
          echo "--DOCKER_HUB_USERNAME" + ${{ secrets.DOCKER_HUB_USERNAME }}
          docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ steps.meta.outputs.tags }} ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:latest

      # Step 5: Push the Docker image to the registry
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ steps.meta.outputs.tags }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:latest

  docker-image-backend:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub or another registry
      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          # username: ${{ secrets.DOCKER_USERNAME }}
          # password: ${{ secrets.DOCKER_PASSWORD }}
          # registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}

      # Step 3: Build the Docker image with a tag based on commit SHA
      - name: Build Docker Image
        run: |
          echo "--DOCKER_HUB_USERNAME" + ${{ secrets.DOCKER_HUB_USERNAME }}
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ env.VERSION }} .

      # Step 4: Tag the image as "latest" for easy reference
      - name: Tag Docker Image as latest
        run: |
          echo "--DOCKER_HUB_USERNAME" + ${{ secrets.DOCKER_HUB_USERNAME }}
          docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ env.VERSION }} ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:latest

      # Step 5: Push the Docker image to the registry
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:latest
