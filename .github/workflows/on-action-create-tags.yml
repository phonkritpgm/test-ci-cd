
name: Run Github Actions CI/CD

on:
  # release:
  #   types: [tags]
  #   tags: 
  #     - v*.*.*

  push:
    branches:
      - main
    tags: 
      - v*.*.*

  # pull_request:
  #   branches:
  #     - main
  #   tags:
  #     - v*
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-condition-on-release:
    runs-on: windows-latest
    steps:
      - name: check event name
        run: |
          echo ${{ github.event_name }}
          echo ${{ github.workspace }}

      - name: check condition event
        if: ${{ github.event_name == 'tags' }}
        run: |
          echo 'event is not math '
          exit 1

  docker-image-fontend:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Check output
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          echo $RELEASE_VERSION
          echo ${{ steps.vars.outputs.tag }}

      # Step 2: Log in to Docker Hub or another registry
      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          # username: ${{ secrets.DOCKER_USERNAME }}
          # password: ${{ secrets.DOCKER_PASSWORD }}
          # registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}

      # Step 3: Build the Docker image with a tag based on commit SHA
      - name: Build Docker Image
        run: |
          echo "--DOCKER_HUB_USERNAME" + ${{ secrets.DOCKER_HUB_USERNAME }}
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:font-${{ steps.vars.outputs.tag }} -f ./secuill_monitor_client/Dockerfile .

      # Step 4: Tag the image as "latest" for easy reference
      - name: Tag Docker Image as latest
        run: |
          echo "--DOCKER_HUB_USERNAME" + ${{ secrets.DOCKER_HUB_USERNAME }}
          docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:font-${{ steps.vars.outputs.tag }} ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:font-latest

      # Step 5: Push the Docker image to the registry
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:font-${{ steps.vars.outputs.tag }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:font-latest

  docker-image-backend:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      # Step 2: Log in to Docker Hub or another registry
      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          # username: ${{ secrets.DOCKER_USERNAME }}
          # password: ${{ secrets.DOCKER_PASSWORD }}
          # registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}

      # Step 3: Build the Docker image with a tag based on commit SHA
      - name: Build Docker Image
        run: |
          echo "--DOCKER_HUB_USERNAME" + ${{ secrets.DOCKER_HUB_USERNAME }}
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:back-${{ steps.vars.outputs.tag }} -f ./backend-secuill/Dockerfile .

      # Step 4: Tag the image as "latest" for easy reference
      - name: Tag Docker Image as latest
        run: |
          echo "--DOCKER_HUB_USERNAME" + ${{ secrets.DOCKER_HUB_USERNAME }}
          docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:back-${{ steps.vars.outputs.tag }} ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:back-latest

      # Step 5: Push the Docker image to the registry
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:back-${{ steps.vars.outputs.tag }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:back-latest
