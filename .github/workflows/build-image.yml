name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main  # Optional: Trigger on pull requests to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub or another registry
      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          # username: ${{ secrets.DOCKER_USERNAME }}
          # password: ${{ secrets.DOCKER_PASSWORD }}
          # registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}

      # Step 3: Build the Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ github.sha }}
        # docker tag ${{ secrets.DOCKER_USERNAME }}/testdocker:latest

      # Step 4: Push the Docker image to the registry
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:${{ github.sha }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:latest