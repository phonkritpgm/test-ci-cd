
name: Run Github Actions

on: 
  push:
    branches:
      - main
jobs:

  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init]

  # Sonarqube
  SonarQube-Scan:
      runs-on: ubuntu-latest
      needs: [init]

      steps:
         # 
         # Checkout the repository content
         # 
        - name: Checkout source code
          uses: actions/checkout@v2
          with:
             # Disabling shallow clone 
            fetch-depth: 0

        - name: Setup node.js
          uses: actions/setup-node@v1
          with:
            java-version: 12
        
        - name: Install dependencies
          run: yarn install

        - name: SonarCloud Scan
          uses: sonarsource/sonarqube-scan-action@v1
          env:
            GITHUB_TOKEN: ${{ secrets.GIT_HUB_PEROSNAL_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} 

         # 
         # Print out the artifacts list
         # 
        - name: Print artifacts
          run: ls -R ./dist
  # Sonarqube

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: on windows
        run: node --version
      - name: on moc os
        run: npm --version
      - name: on linux
        run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test, SonarQube-Scan]

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test,test]

  with-test:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test,test,release,with-test]

