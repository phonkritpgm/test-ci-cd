
name: Run Github Actions

on: 
  push:
    branches:
      - main
jobs:

  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init]

  # Sonarqube
  SonarQube-Scan:
      runs-on: ubuntu-latest
      needs: [init]

      steps:
         # 
         # Checkout the repository content
         # 
        - name: Checkout
          uses: actions/checkout@v3
          with:
             # Disabling shallow clone 
            fetch-depth: 0
         # 
         # Remove 'pom.xml' otherwise Sonar will fail forcing to use Maven   
         # 
        - name: Remove pom
          run: rm -f pom.xml    
         # 
         # Setup Java JDK
         # 
        - name: Setup JDK
          uses: actions/setup-java@v1
          with:
            java-version: 11
        
        - name: Cache SonarQube packages
          uses: action/cache@v1
          with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

        - name: Cache Maven packages
          uses: actions/cache@v1
          with:
            path: ~/.m2
            key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
            restore-keys: ${{ runner.os }}-m2 
         # 
         # Setup Node.js (for Sonar)
         # 
        #  - name: Setup Node.js
        #    uses: actions/setup-node@v2   
        #    with:
        #      node-version: 20   
         # 
         # Run the build of project by ANT
         # 
         ### - name: Build
         ###   run: ant buildAll
         # 
         # Run the Sonar scan
         #

        - name: SonarCloud Scan
          uses: sonarsource/sonarcloud-github-action@v1.4
          env:
            GITHUB_TOKEN: ${{ secrets.GIT_HUB_PEROSNAL_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          #  with:
          #    args: >
          #      -Dsonar.organization-swaraj1.sys
          #      -Dsonar.projectKey-SonarCloudCodeAnalysis
          #      -Dsonar.python.coverage.reportPaths=coverage.xml

         # 
         # Print out the artifacts list
         # 
        - name: Print artifacts
          run: ls -R ./dist
  # Sonarqube

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: on windows
        run: node --version
      - name: on moc os
        run: npm --version
      - name: on linux
        run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test, SonarQube-Scan]

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test,test]

  with-test:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test,test,release,with-test]

