
name: Run Github Actions

on: 
  push:
    branches:
      - main

jobs:

  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init]

  # Sonarqube action scan code analysis
  SonarQube-Scan:
      runs-on: ubuntu-latest
      needs: [init]

      steps:
         # 
         # Checkout the repository content
         # 
        - name: Checkout source code
          uses: actions/checkout@v3
          with:
             # Disabling shallow clone 
            fetch-depth: 0

        - name: SonarCloud Scan
          uses: sonarsource/sonarcloud-github-action@master
          env:
            GITHUB_TOKEN: ${{ secrets.GIT_HUB_PEROSNAL_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

          with:
            args: >
              -Dsonar.organization=phonkritpgm
              -Dsonar.projectKey=phonkritpgm_test-ci-cd
              
        # -Dsonar.python.coverage.reportPaths=coverage.xml
  # Sonarqube

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: on windows
        run: node --version
      - name: on moc os
        run: npm --version
      - name: on linux
        run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test, SonarQube-Scan]

  # #################
  # Docker image
  build_docker_build_image_push_registry:
    runs-on: ubuntu-latest
    needs: [init,unit-test,test]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3

      - name: Docker build image
        run: docker build . -t ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:v2

      - name: Docker push image to registry
        # uses: docker/build-push-action@v6
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:v2

        # continue-on-error: true
        # with:
        #   context: .
        #   file: ./Dockerfile
        #   push: true
        #   tags: ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:v2
  # #################
  # Docker registry

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test,test]

  with-test:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test,test,release,with-test, build_docker_build_image_push_registry]

