name: "My workflow"
on: push

jobs: 
  init:
    runs-on: ubuntu-latest
    steps:
      - name: "start job"
      - uses: actions/checkout@v1
      - name: "run node version"
      - run: node --version
      - name: "run npm version"
      - run: npm --version
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init]
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test]
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test,test]
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test,test,release]

jobs:
  runs-on: ubuntu-latest
  if: ${{ always() }}
  needs: [test]
  steps:
    - uses: actions/checkout@v1
    - run: node --version
    - run: npm --version





