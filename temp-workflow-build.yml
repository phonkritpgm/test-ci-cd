
name: Run Github Actions

on: 
  push:
    branches:
      - main
jobs:

  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init]

  # Sonarqube action scan code analysis
  SonarQube-Scan:
      runs-on: ubuntu-latest
      needs: [init]

      steps:
         # 
         # Checkout the repository content
         # 
        - name: Checkout source code
          uses: actions/checkout@v3
          with:
             # Disabling shallow clone 
            fetch-depth: 0

        - name: SonarCloud Scan
          uses: sonarsource/sonarcloud-github-action@master
          env:
            GITHUB_TOKEN: ${{ secrets.GIT_HUB_PEROSNAL_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

          with:
            args: >
              -Dsonar.organization=phonkritpgm
              -Dsonar.projectKey=phonkritpgm_test-ci-cd
              
        # -Dsonar.python.coverage.reportPaths=coverage.xml
  # Sonarqube

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: on windows
        run: node --version
      - name: on moc os
        run: npm --version
      - name: on linux
        run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test, SonarQube-Scan]

  # #################
  # Docker image
  build_docker_build_image_push_registry:
    runs-on: ubuntu-latest
    needs: [init,unit-test,test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # - name: Set up Docker buildx
      #   uses: docker/setup-buildx-action@v1
      #   with:
      #     version: v0.7.0

      # - name: Set up Docker Buildx
      #   id: buildx
      #   uses: docker/setup-buildx-action@v3
      #   with:
      #     version: ${{ inputs.buildx-version || env.BUILDX_VERSION }}
      #     driver-opts: |
      #       network=host
      #       image=${{ inputs.buildkit-image || env.BUILDKIT_IMAGE }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        # continue-on-error: true
        with:
          context: .
          file: ./
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/testdocker:v2
          push: true
  # #################
  # Docker registry

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test,test]

  with-test:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: node --version
      - run: npm --version
    if: ${{ always() }}
    needs: [init,unit-test,test,release,with-test, build_docker_build_image_push_registry]

  # Step 5: Deploy to server via SSH
  deployment-server:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [init,unit-test,test,release,with-test, build_docker_build_image_push_registry]
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22  # Use your server’s SSH port (default is 22)
          script: |
            # Pull the latest Docker image
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest
            
            # Stop and remove the existing container
            docker rm -f my-app || true
            
            # Run a new container with the latest image
            docker run -d --name my-app -p 80:80 ${{ secrets.DOCKER_USERNAME }}/my-app:latest